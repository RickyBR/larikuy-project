version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: larikuy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-larikuy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larikuy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-larikuy_master}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larikuy_admin} -d ${POSTGRES_DB:-larikuy_master}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - larikuy-net

  redis:
    image: redis:7-alpine
    container_name: larikuy-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - larikuy-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: larikuy-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-larikuy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-larikuy_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - larikuy-net

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: larikuy-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - larikuy-net

  core-activity-service:
    build:
      context: .
      dockerfile: core-activity-service/Dockerfile
    container_name: larikuy-core-activity
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${ACTIVITY_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - larikuy-net

  coach-discovery-service:
    build:
      context: .
      dockerfile: coach-discovery-service/Dockerfile
    container_name: larikuy-coach-discovery
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${COACH_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - larikuy-net

networks:
  larikuy-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
